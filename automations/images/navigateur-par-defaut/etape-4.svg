><text x="64" y="391" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Apparence</text><text x="64" y="431" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Moteur de recherche</text><text x="64" y="471" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Navigateur par défaut</text><text x="64" y="511" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Au démarrage</text><text x="64" y="551" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Langues</text><text x="64" y="591" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Téléchargements</text><text x="64" y="631" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Accessibilité</text><text x="64" y="671" font-size="16" font-weight="400" fill="#1f1f1f" text-anchor="start" >Système</text><path d="M 30 684 H 320 a 20 20 0 0 1 0 40 H 30 Z" fill="#D3E3FD"/><text x="64" y="711" font-size="16" font-weight="600" fill="#0B57D0" text-anchor="start" >Réinitialiser les paramètres</text><text x="390" y="230" font-size="22" font-weight="400" fill="#1f1f1f" text-anchor="start" >Réinitialiser les paramètres</text><rect x="390" y="252" width="740" height="72" rx="14" fill="#ffffff" stroke="#e3e6ea" stroke-width="1" /><text x="416" y="296" font-size="18" font-weight="400" fill="#1f1f1f" text-anchor="start" >Restaurer les paramètres par défaut</text><path d="M 1078 278 h 16 v 16 M 1094 278 l -13 13" stroke="#444746" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="1068" y="272" width="0" height="0" rx="0" fill="none" stroke="none" stroke-width="1" /><text x="390" y="366" font-size="16" font-weight="400" fill="#5f6368" text-anchor="start" >Vos favoris, votre historique et vos mots de passe enregistrés</text><text x="390" y="390" font-size="16" font-weight="400" fill="#5f6368" text-anchor="start" >sont conservés.</text><rect x="30" y="130" width="1140" height="596" rx="0" fill="#000000" stroke="none" stroke-width="1" opacity="0.32"/><rect x="300" y="200" width="600" height="380" rx="24" fill="#ffffff" stroke="none" stroke-width="1" filter="url(#sh2)"/><text x="336" y="258" font-size="24" font-weight="400" fill="#1f1f1f" text-anchor="start" >Réinitialiser les paramètres ?</text><text x="336" y="304" font-size="17" font-weight="400" fill="#444746" text-anchor="start" >Cette action rétablira la page de démarrage, la page Nouvel</text><text x="336" y="331" font-size="17" font-weight="400" fill="#444746" text-anchor="start" >onglet, le moteur de recherche et les onglets épinglés.</text><text x="336" y="358" font-size="17" font-weight="400" fill="#444746" text-anchor="start" >Elle désactivera aussi toutes les extensions et effacera les</text><text x="336" y="385" font-size="17" font-weight="400" fill="#444746" text-anchor="start" >données temporaires comme les cookies. Vos favoris, votre</text><text x="336" y="412" font-size="17" font-weight="400" fill="#444746" text-anchor="start" >historique et vos mots de passe enregistrés ne seront pas</text><text x="336" y="439" font-size="17" font-weight="400" fill="#444746" text-anchor="start" >effacés.</text><rect x="490" y="504" width="120" height="44" rx="22" fill="#ffffff" stroke="#747775" stroke-width="1" /><text x="550" y="532" font-size="17" font-weight="500" fill="#0B57D0" text-anchor="middle" >Annuler</text><rect x="628" y="504" width="240" height="44" rx="22" fill="#0B57D0" stroke="none" stroke-width="1" /><text x="748" y="532" font-size="17" font-weight="500" fill="#fff" text-anchor="middle" >Réinitialiser les paramètres</text><rect x="619" y="495" width="258" height="62" rx="22" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.9"/><rect x="619" y="495" width="258" height="62" rx="22" fill="none" stroke="#2B6BFF" stroke-width="7" /></svg>