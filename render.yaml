# Déploiement du backend CarePilot sur Render.
#
# Render monte en HTTPS tout seul, donc le pont et la page du proche parlent
# wss:// sur le port 443 — rien à ouvrir chez la personne aidée.
#
# Attention au plan gratuit : le service s'endort après 15 min sans trafic et
# met environ une minute à repartir. Réveillez-le avant une démo, ou passez sur
# une instance payante le jour J.

services:
  - type: web
    name: carepilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      # À créer dans l'interface Render, jamais dans ce fichier versionné.
      - key: HAI_API_KEY
        sync: false
      # L'URL publique du service, utilisée pour fabriquer le lien du proche.
      # À renseigner après le premier déploiement, quand Render l'a attribuée.
      - key: CAREPILOT_PUBLIC_URL
        sync: false
      - key: HOLO_MODEL
        value: holo3-1-35b-a3b
      - key: CAREPILOT_MAX_STEPS
        value: "25"
