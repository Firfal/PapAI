name: PapAI
options:
  bundleIdPrefix: com.quentin.papai
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PapAI:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../shared
      - Shared
      - Resources
    dependencies:
      - target: PapAIWidget
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PapAI
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: PapAI se connecte au serveur de démonstration sur votre réseau local.
        NSMicrophoneUsageDescription: PapAI utilise le micro pour que vous dictiez vos consignes et vos réponses à Holo. L’enregistrement est transcrit par le serveur PapAI (Gladia), puis effacé de l’iPhone.
        NSSpeechRecognitionUsageDescription: PapAI affiche vos mots pendant que vous parlez, pour préciser le plan, modifier une étape ou répondre à Holo.
        NSCameraUsageDescription: PapAI utilise l’appareil photo pour scanner le QR affiché sur l’ordinateur de votre proche.
        CFBundleURLTypes:
          - CFBundleURLName: com.quentin.papai.aidant
            CFBundleURLSchemes: [papai]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quentin.papai.aidant
        PRODUCT_NAME: PapAIAidant
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
  PapAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Resources/Assets.xcassets
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PapAI
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quentin.papai.aidant.widget
        PRODUCT_NAME: PapAIWidget
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
